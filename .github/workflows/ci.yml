name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node ../../packages/cli/dist/src/index.js sync
        working-directory: examples/invoice-download
      - run: node ../../packages/cli/dist/src/index.js status
        working-directory: examples/invoice-download
      - run: node ../../packages/cli/dist/src/index.js doctor
        working-directory: examples/invoice-download
      - run: node ../../packages/cli/dist/src/index.js rules validate
        working-directory: examples/invoice-download
      - run: node ../../packages/cli/dist/src/index.js impact RULE-BILLING-001
        working-directory: examples/invoice-download
      - run: node ../../packages/cli/dist/src/index.js context RULE-BILLING-001
        working-directory: examples/invoice-download
      - run: node ../../packages/cli/dist/src/index.js verify scaffold UI-INVOICE-001
        working-directory: examples/invoice-download
      - run: git diff --exit-code -- examples/invoice-download
